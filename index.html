<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11152b"><title>CineVerse AI</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0e1326;color:#f6f7ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:640px;margin:auto;padding:24px 18px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:25px;font-weight:850;letter-spacing:-1px}.brand span{color:#aa98ff}.wallet{border-radius:30px;background:#27304e;padding:10px 14px;font-weight:700}h1{font-size:30px;margin:36px 0 8px}p{color:#b9c0d8;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:25px 0}.tile{border:1px solid #414b72;background:linear-gradient(140deg,#293356,#1b233d);color:white;border-radius:20px;padding:20px 15px;min-height:140px;text-align:left;font-size:17px;font-weight:750}.emoji{display:block;font-size:36px;margin-bottom:17px}.panel{background:#202944;border:1px solid #414b72;border-radius:19px;padding:19px;margin:15px 0}.panel h3{margin-top:0}.action{display:block;width:100%;border:0;border-radius:13px;background:#947cfa;color:white;font-size:16px;font-weight:750;padding:15px;margin:12px 0}.secondary{background:#3c4669}.hidden{display:none}textarea{width:100%;min-height:110px;background:#10172c;color:white;border:1px solid #526087;border-radius:12px;padding:12px;font-size:16px}.result{white-space:pre-wrap;line-height:1.7;background:#10172c;padding:14px;border-radius:12px;margin-top:14px}small{color:#a9b2cf}footer{font-size:12px;text-align:center;color:#919ab9;margin-top:30px}</style></head>
<body><main><div class="top"><div class="brand">Cine<span>Verse</span> AI</div><div class="wallet">🪙 <span id="credits">0</span></div></div><h1>创作你的无限宇宙 ✨</h1><p>AI 真人短剧、音乐、图片和漫画，全部从一个地方开始。</p><div class="grid"><button class="tile" onclick="openTool('video')"><span class="emoji">🎬</span>AI 真人短剧</button><button class="tile" onclick="openTool('music')"><span class="emoji">🎵</span>AI 音乐</button><button class="tile" onclick="openTool('image')"><span class="emoji">🎨</span>AI 图片</button><button class="tile" onclick="openTool('comic')"><span class="emoji">📖</span>AI 漫画</button></div><section class="panel"><h3>🎁 免费积分</h3><p>模拟观看广告获得积分。当前是测试模式，不会播放真实广告，也没有广告收入。</p><button class="action" onclick="reward()">模拟看广告 · 领取5积分</button><small>测试积分只保存在这台设备的浏览器中。</small></section><section class="panel"><h3>⚡ 付费加速</h3><p>未来可以购买积分、免广告、优先生成。</p><button class="action secondary" onclick="alert('测试版尚未接入付款功能')">查看付费套餐（演示）</button></section><section class="panel hidden" id="creator"><h3 id="heading"></h3><p>第一版先生成创作规划模板。真实 AI 图片、歌曲、视频生成尚未接入。</p><textarea id="idea" placeholder="输入你的创作想法……"></textarea><button class="action" onclick="makeDraft()">生成创作草稿（免费）</button><div class="result hidden" id="output"></div><button class="action secondary" onclick="document.getElementById('creator').classList.add('hidden')">关闭</button></section><footer>CineVerse AI · 免费原型 v1 · 无真实广告或付款</footer></main><script>
let credits=Number(localStorage.getItem('cineverse_credits')||0);if(!Number.isFinite(credits)||credits<0)credits=0;let mode='video';const labels={video:'🎬 AI 真人短剧',music:'🎵 AI 音乐',image:'🎨 AI 图片',comic:'📖 AI 漫画'};function updateCredits(){document.getElementById('credits').textContent=credits}updateCredits();function reward(){credits+=5;localStorage.setItem('cineverse_credits',credits);updateCredits();alert('模拟奖励成功：+5积分！')}function openTool(type){mode=type;document.getElementById('heading').textContent=labels[type];document.getElementById('creator').classList.remove('hidden');document.getElementById('output').classList.add('hidden');document.getElementById('creator').scrollIntoView({behavior:'smooth'})}function makeDraft(){const idea=document.getElementById('idea').value.trim();if(!idea){alert('请先输入创作想法');return}let result='';if(mode==='video')result='短剧：《'+idea+'》\n第一幕：主角与世界介绍。\n第二幕：突发事件打破平静。\n第三幕：主角面对重要选择。\n分镜：远景 → 中景 → 人物特写 → 悬念结尾。';if(mode==='music')result='歌曲主题：《'+idea+'》\n[Verse] 描述故事与情绪。\n[Chorus] 用简洁有力的句子突出主题。\n[Bridge] 制造情绪转折。\n建议：再确定语言、曲风和节奏。';if(mode==='image')result='图片提示词草稿：\n主题：'+idea+'\n电影级构图，主体清晰，层次丰富，自然光影，细节精致。\n建议补充：人物、背景、服装、镜头角度、画面比例。';if(mode==='comic')result='漫画：《'+idea+'》\n第1格：场景与角色登场。\n第2格：角色发现异常。\n第3格：矛盾升级与对白。\n第4格：悬念结尾。';const output=document.getElementById('output');output.textContent=result;output.classList.remove('hidden')}
</script></body></html>
