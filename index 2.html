<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111426"><title>CineVerse AI V2</title><style>*{box-sizing:border-box}body{margin:0;background:#101426;color:#fff;font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:650px;margin:auto;padding:25px 18px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:27px;margin:0}h2{font-size:27px;margin-top:35px}p,.muted{color:#b8bfd8;line-height:1.6}.wallet,.panel,.tile{background:#232b49;border:1px solid #414b73;border-radius:20px}.wallet{padding:12px;white-space:nowrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.tile{color:white;text-align:left;padding:22px 15px;min-height:135px;font-size:17px;font-weight:700}.tile span{display:block;font-size:34px;margin-bottom:17px}.panel{padding:20px;margin:18px 0}button{cursor:pointer}.action{border:0;background:#8e79ef;color:#fff;border-radius:13px;font-size:16px;font-weight:700;padding:14px;width:100%;margin-top:12px}.secondary{background:#364268}.back{background:none;color:#d9d2ff;border:0;padding:8px 0;font-size:16px}.hidden{display:none}textarea,input,select{width:100%;padding:13px;border-radius:11px;border:1px solid #566186;background:#11182f;color:white;font-size:16px;margin:7px 0 12px}textarea{min-height:105px;resize:vertical}.result{background:#121a32;padding:16px;border-radius:12px;white-space:pre-wrap;line-height:1.8;margin-top:15px}label{font-weight:650}small{color:#aeb6d3;line-height:1.5}footer{text-align:center;color:#8d96b5;margin-top:35px;font-size:12px}</style></head><body><main><header><h1>CineVerse <span style="color:#a38bff">AI</span></h1><div class="wallet">🪙 <b id="credits">0</b> 积分</div></header><div id="home"><h2>创作你的无限宇宙 ✨</h2><p>真人短剧、原创音乐、图片与漫画，全部从这里开始。</p><div class="grid"><button class="tile" onclick="openCreator('script')"><span>🎬</span>短剧剧本</button><button class="tile" onclick="openCreator('lyrics')"><span>🎵</span>原创歌词</button><button class="tile" onclick="openCreator('image')"><span>🎨</span>图片创意</button><button class="tile" onclick="openCreator('comic')"><span>📖</span>漫画分镜</button></div><div class="panel"><h3>🎁 免费积分</h3><p>模拟观看广告领取测试积分。当前没有真实广告或广告收入。</p><button class="action" onclick="reward()">模拟看广告 · +5 积分</button><small>测试积分仅保存在此浏览器，不具有现金价值。</small></div><div class="panel"><h3>⚡ 付费加速</h3><p>未来接入真实 AI 模型与付款后，才能提供付费优先服务。</p><button class="action secondary" onclick="alert('当前是免费测试版，尚未开放付款。')">查看套餐（演示）</button></div></div><section id="creator" class="hidden"><button class="back" onclick="goHome()">← 返回首页</button><h2 id="heading"></h2><p id="description"></p><label for="topic">创作主题</label><textarea id="topic" placeholder="例如：一个普通人在未来城市意外觉醒超能力"></textarea><label for="style">风格</label><select id="style"><option>热血励志</option><option>浪漫感人</option><option>悬疑惊悚</option><option>轻松搞笑</option><option>史诗奇幻</option></select><button class="action" onclick="generate()">免费生成创作草稿</button><div id="output" class="result hidden"></div><button id="copyBtn" class="action secondary hidden" onclick="copyResult()">复制草稿</button><small>V2 为离线规则模板生成器，不是大语言模型；不会生成真实音频、图片或视频。</small></section><footer>CineVerse AI · V2 免费原型 · 无需账号 · RM0 开发测试</footer></main><script>let balance=Number(localStorage.getItem('cineverse_credits')||0);if(!Number.isFinite(balance)||balance<0)balance=0;let mode='script';function update(){document.getElementById('credits').textContent=balance}update();function reward(){balance+=5;localStorage.setItem('cineverse_credits',balance);update();alert('测试成功！获得 5 积分')}const config={script:['🎬 短剧剧本','输入一个故事概念，制作包含人物、对白和镜头的基础草稿。'],lyrics:['🎵 原创歌词','输入歌曲主题，生成可继续编辑的原创歌词草稿。'],image:['🎨 图片创意','生成适合图片模型使用的文字提示词草稿。'],comic:['📖 漫画分镜','把故事主题整理成四格漫画分镜草稿。']};function openCreator(m){mode=m;document.getElementById('home').classList.add('hidden');document.getElementById('creator').classList.remove('hidden');document.getElementById('heading').textContent=config[m][0];document.getElementById('description').textContent=config[m][1];document.getElementById('output').classList.add('hidden');document.getElementById('copyBtn').classList.add('hidden');scrollTo(0,0)}function goHome(){document.getElementById('creator').classList.add('hidden');document.getElementById('home').classList.remove('hidden');scrollTo(0,0)}function generate(){const topic=document.getElementById('topic').value.trim(),style=document.getElementById('style').value;if(!topic){alert('请先输入创作主题');return}let t='';if(mode==='script')t='《'+topic+'》\n类型：'+style+'\n\n角色：主角、伙伴、神秘来客。\n\n场景一｜开端\n镜头：城市远景切换到主角特写。\n主角：「今天看起来和平常没什么不同。」\n伙伴：「你有没有发现，最近的事情越来越奇怪？」\n\n场景二｜冲突\n镜头：突然出现的异象，快速切近主角。\n神秘来客：「你终于来了。」\n主角：「你到底是谁？」\n\n场景三｜悬念\n镜头：主角望向异象，画面渐暗。\n旁白：真正的故事，现在才开始。\n\n改写建议：将上述通用场景替换成与「'+topic+'」直接相关的具体事件。';if(mode==='lyrics')t='《'+topic+'》\n曲风：'+style+'\n\n[Verse 1]\n走过漫长的路 还记得最初\n风吹散了迷雾 我仍不认输\n\n[Pre-Chorus]\n心里的那束光 从来没停住\n\n[Chorus]\n就让梦想照亮前方\n让每一步都有回响\n即使世界改变模样\n我仍勇敢奔向远方\n\n[Verse 2]\n时间写下故事 也留下领悟\n再小的一个愿望 都值得守护\n\n[Bridge]\n如果夜太长 就自己点亮光\n\n[Final Chorus]\n就让梦想照亮前方\n带着希望再次启航\n\n主题改写提示：围绕「'+topic+'」替换意象和叙事细节。';if(mode==='image')t='图片提示词草稿\n主题：'+topic+'\n风格：'+style+'\n主体：突出主题人物或核心物体\n场景：具有层次感的真实环境\n光影：电影级自然光、柔和轮廓光\n构图：主体清晰，背景富有纵深\n质量：高细节、协调色彩、真实材质\n建议比例：海报 3:4，视频画面 16:9';if(mode==='comic')t='漫画：《'+topic+'》\n风格：'+style+'\n\n第1格｜建立场景\n画面：交代时间地点，主角登场。\n对白：「今天会发生什么呢？」\n\n第2格｜发现线索\n画面：主角注意到不寻常的细节。\n对白：「等等，那是什么？」\n\n第3格｜矛盾升级\n画面：另一个角色突然出现。\n对白：「现在已经来不及了！」\n\n第4格｜悬念收尾\n画面：主角正面特写，背景留下伏笔。\n对白：「事情才刚刚开始。」\n\n制作提示：角色外观保持一致，对话框尾巴对准说话者。';const o=document.getElementById('output');o.textContent=t;o.classList.remove('hidden');document.getElementById('copyBtn').classList.remove('hidden')}async function copyResult(){const t=document.getElementById('output').textContent;try{await navigator.clipboard.writeText(t);alert('已复制草稿')}catch(e){alert('无法自动复制，请长按草稿手动复制')}} </script></body></html>
